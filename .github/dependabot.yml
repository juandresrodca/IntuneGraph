version: 2
updates:
  - package-ecosystem: npm
    directory: "/site"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      # The Astro landing page behind the Pages demo: pages.yml publishes this tree
      # to a live site, so a grouped minor/patch bump is one review of what ships.
      site-npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/tools/gif"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      # The headless GIF recorder, run by hand to regenerate the README demo. Kept
      # separate from the site group: a build tool and a published page should not
      # share one review.
      gif-npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies"]
