name: Release

# Pushing a v* tag publishes that version to the PowerShell Gallery - but only after
# the full CI matrix passes again on the tagged commit, and only if the tag matches the
# manifest. A Gallery version can be unlisted but its number can never be reused, so
# everything that can be checked is checked before the one step that cannot be undone.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tag reaches the script through env, never interpolated into it.
      - name: Check the tag matches ModuleVersion
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $manifest = Import-PowerShellDataFile ./src/IntuneGraphKit/IntuneGraphKit.psd1
          if ($env:TAG -ne "v$($manifest.ModuleVersion)") {
            throw "Tag '$env:TAG' does not match ModuleVersion $($manifest.ModuleVersion). Nothing was published."
          }

      - name: Publish to the PowerShell Gallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: ./build.ps1 -Task Publish
