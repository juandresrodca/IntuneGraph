<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IntuneGraph - Silver Chariot Corporate</title>
<style>
  :root {
    --bg:#0a0e16; --bg2:#0d1320; --panel:#111a2b; --panel2:#16213a;
    --line:#1e2c45; --line2:#27395a;
    --green:#9fef00; --green-dim:#6fa800; --blue:#58a6ff; --purple:#c792ea;
    --cyan:#56d4dd; --red:#ff7b72; --amber:#ffb454;
    --text:#c9d4e3; --muted:#7c8aa0; --mute2:#56657d; --accent:var(--green);
    /* node-type legend swatches (mirror JS TYPE_COLORS) */
    --group:#9fef00; --device:#58a6ff; --user:#c792ea; --app:#ff7b72;
    --config:#ffb454; --compliance:#56d4dd; --script:#f778ba; --filter:#d2a8ff; --builtin:#c9d4e3;
    --mono:'JetBrains Mono',ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace;
    --sans:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; color:var(--text); font-family:var(--sans);
    background:
      radial-gradient(900px 500px at 88% -12%, rgba(88,166,255,.10), transparent 60%),
      radial-gradient(760px 520px at -5% 112%, rgba(159,239,0,.06), transparent 55%),
      var(--bg); }
  .grid-bg { position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:linear-gradient(rgba(40,57,90,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(40,57,90,.16) 1px,transparent 1px);
    background-size:42px 42px; mask-image:radial-gradient(circle at 60% 20%,#000,transparent 85%); }
  #app { position:relative; z-index:1; display:flex; flex-direction:column; height:100vh; }
  header { display:flex; align-items:center; gap:14px; padding:14px 20px; position:relative; overflow:hidden;
    background:linear-gradient(180deg,var(--panel),var(--bg2)); border-bottom:1px solid var(--line); }
  header::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--green); box-shadow:0 0 12px rgba(159,239,0,.5); }
  header h1 { font-family:var(--mono); font-size:16px; margin:0; font-weight:600; letter-spacing:-.3px; color:var(--text); }
  header .meta { font-family:var(--mono); font-size:11.5px; color:var(--muted); }
  .stage { flex:1; display:flex; min-height:0; }
  .toolbar { width:230px; padding:16px; border-right:1px solid var(--line); overflow:auto; font-size:13px;
    background:linear-gradient(180deg,rgba(17,26,43,.6),rgba(13,19,32,.6)); backdrop-filter:blur(2px); }
  .toolbar h2 { font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted);
    margin:20px 0 9px; display:flex; align-items:center; gap:8px; }
  .toolbar h2::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 7px var(--green); flex:none; }
  .toolbar h2:first-child { margin-top:0; }
  #search { width:100%; padding:8px 10px; background:#0a1018; border:1px solid var(--line2); border-radius:8px;
    color:var(--text); font-family:var(--mono); font-size:12.5px; }
  #search::placeholder { color:var(--mute2); }
  #search:focus { outline:none; border-color:var(--green); }
  .legend-item, .filter-item { display:flex; align-items:center; gap:9px; padding:4px 0; cursor:pointer; user-select:none; font-size:12.5px; }
  .legend-item { font-family:var(--mono); font-size:11.5px; color:var(--muted); }
  .dot { width:11px; height:11px; border-radius:50%; flex:none; box-shadow:0 0 6px currentColor; }
  .filter-item input { accent-color:var(--green); }
  .count { margin-left:auto; font-family:var(--mono); color:var(--mute2); font-size:11px; font-variant-numeric:tabular-nums; }
  .canvas-wrap { flex:1; position:relative; min-width:0; }
  canvas { display:block; width:100%; height:100%; cursor:grab; }
  canvas.grabbing { cursor:grabbing; }
  #side { position:absolute; top:14px; right:14px; width:308px; max-height:calc(100% - 28px); overflow:auto;
    background:linear-gradient(180deg,var(--panel),var(--bg2)); border:1px solid var(--line2); border-radius:14px; padding:16px; display:none;
    box-shadow:0 24px 60px rgba(0,0,0,.5); font-size:13px; }
  #side.show { display:block; }
  #side .stype { font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--green); }
  #side h3 { font-family:var(--mono); margin:5px 0 12px; font-size:15px; color:var(--text); word-break:break-word; }
  #side .kv { display:flex; gap:8px; padding:4px 0; border-top:1px solid var(--line); font-size:12px; }
  #side .kv b { font-family:var(--mono); color:var(--mute2); font-weight:400; min-width:96px; }
  #side .kv span { font-family:var(--mono); color:var(--text); word-break:break-word; }
  #side .edges { margin-top:12px; }
  #side .edge { padding:5px 0; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
  #side .edge b { color:var(--text); font-weight:500; }
  #side .close { position:absolute; top:12px; right:14px; cursor:pointer; color:var(--mute2); font-size:18px; line-height:1; }
  #side .close:hover { color:var(--red); }
  .hint { position:absolute; left:14px; bottom:14px; font-family:var(--mono); font-size:10.5px; color:var(--mute2);
    background:rgba(10,14,22,.6); border:1px solid var(--line); padding:6px 10px; border-radius:7px; backdrop-filter:blur(2px); }
  .banner { position:absolute; left:50%; top:14px; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--line2);
    padding:8px 13px; border-radius:9px; font-family:var(--mono); font-size:11.5px; color:var(--muted); display:none; }
  .banner.show { display:block; }
  button.reset { margin-top:14px; width:100%; padding:8px; background:rgba(159,239,0,.06); color:var(--green);
    border:1px solid rgba(159,239,0,.35); border-radius:8px; cursor:pointer; font-family:var(--mono); font-size:12px; font-weight:600; transition:.15s; }
  button.reset:hover { background:rgba(159,239,0,.12); }
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--line2); border-radius:3px; }
</style>
</head>

<div id="app">

      <div class="legend-item"><span style="width:18px;height:0;border-top:1px solid var(--line)"></span>member of</div>
      <div class="legend-item"><span style="width:18px;height:0;border-top:2px dotted var(--amber)"></span>filtered by</div>

    <div class="canvas-wrap">

      <div class="banner" id="banner"></div>
      <div class="hint">Drag nodes &middot; scroll to zoom &middot; drag background to pan &middot; click a node for details</div>

        <h3 id="sideName"></h3>

    </div>
  </div>
</div>

const META = {"title":"IntuneGraph - Silver Chariot Corporate","tenantName":"Silver Chariot Corporate","exportedAt":"2026-07-26T23:27:33Z","counts":{"byNodeType":{"CompliancePolicy":2,"Filter":2,"Group":8,"Script":2,"App":4,"Device":9,"ConfigPolicy":4,"Builtin":2,"User":8},"edges":34,"nodes":41}};

const TYPE_COLORS = {
  Device:'#58a6ff', User:'#c792ea', Group:'#9fef00', Filter:'#d2a8ff',
  ConfigPolicy:'#ffb454', CompliancePolicy:'#56d4dd', App:'#ff7b72', Script:'#f778ba', Builtin:'#c9d4e3'
};
const TYPE_RADIUS = { Device:6, User:6, Group:10, Filter:8, ConfigPolicy:11, CompliancePolicy:11, App:11, Script:9, Builtin:12 };

// ---- state ----
const nodes = GRAPH.nodes.map(n => ({...n, x:0, y:0, vx:0, vy:0}));
const nodeById = {}; nodes.forEach(n => nodeById[n.id] = n);
const edges = GRAPH.edges.filter(e => nodeById[e.from] && nodeById[e.to]);
const hidden = new Set();               // hidden node types
let selected = null, hoverId = null;
let scale = 1, offsetX = 0, offsetY = 0;

const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const banner = document.getElementById('banner');

// scale guard
if (nodes.length > 1500) { hidden.add('Device'); hidden.add('User');
  banner.classList.add('show'); banner.textContent = 'Large graph: devices & users hidden by default. Enable them in the sidebar.'; }

// ---- meta + filters ----
const counts = (META && META.counts && META.counts.byNodeType) || {};
document.getElementById('meta').textContent =
  `${nodes.length} nodes · ${edges.length} edges` + (META && META.exportedAt ? ` · exported ${META.exportedAt.slice(0,10)}` : '');

const filtersEl = document.getElementById('filters');
Object.keys(TYPE_COLORS).forEach(type => {
  const c = counts[type]; if (!c) return;
  const row = document.createElement('label'); row.className = 'filter-item';
  row.innerHTML = `<input type="checkbox" ${hidden.has(type)?'':'checked'} data-type="${type}">
    <span class="dot" style="background:${TYPE_COLORS[type]}"></span><span>${type}</span><span class="count">${c}</span>`;
  row.querySelector('input').addEventListener('change', e => {
    if (e.target.checked) hidden.delete(type); else hidden.add(type);
    kick();
  });
  filtersEl.appendChild(row);
});

// ---- layout init (circle seed) ----
const R0 = Math.min(canvas.clientWidth, canvas.clientHeight);
nodes.forEach((n,i) => { const a = (i/nodes.length)*Math.PI*2; n.x = Math.cos(a)*R0*0.35 + (Math.random()-.5)*40; n.y = Math.sin(a)*R0*0.35 + (Math.random()-.5)*40; });

// ---- force simulation ----
let alpha = 1;
function step() {
  const vis = nodes.filter(n => !hidden.has(n.type));
  const k = 0.9;
  for (let i=0;i<vis.length;i++){
    const a = vis[i];
    for (let j=i+1;j<vis.length;j++){
      const b = vis[j];
      let dx = a.x-b.x, dy = a.y-b.y; let d2 = dx*dx+dy*dy || 0.01;
      const rep = 2600*alpha / d2; const d = Math.sqrt(d2);
      const fx = dx/d*rep, fy = dy/d*rep;
      a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    }
  }
  edges.forEach(e => {
    const a = nodeById[e.from], b = nodeById[e.to];
    if (hidden.has(a.type)||hidden.has(b.type)) return;
    let dx = b.x-a.x, dy = b.y-a.y; const d = Math.sqrt(dx*dx+dy*dy)||0.01;
    const target = e.type==='memberOf'?70:120;
    const f = (d-target)*0.02*alpha;
    const fx = dx/d*f, fy = dy/d*f;
    a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
  });
  vis.forEach(n => { n.vx*=k; n.vy*=k; if(n!==dragging){ n.x+=n.vx; n.y+=n.vy; } n.vx*=0.5; n.vy*=0.5; });
  alpha *= 0.985; if (alpha < 0.02) alpha = 0.02;
}
function kick(){ alpha = 0.6; }

// ---- rendering ----
function neighborhood(id){
  const s = new Set([id]);
  edges.forEach(e => { if(e.from===id) s.add(e.to); if(e.to===id) s.add(e.from); });
  return s;
}
function draw() {
  const w = canvas.width = canvas.clientWidth*devicePixelRatio;
  const h = canvas.height = canvas.clientHeight*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);
  ctx.save();
  ctx.translate(canvas.clientWidth/2+offsetX, canvas.clientHeight/2+offsetY);
  ctx.scale(scale,scale);

  const focus = selected ? neighborhood(selected) : null;

  // edges
  edges.forEach(e => {
    const a = nodeById[e.from], b = nodeById[e.to];
    if (hidden.has(a.type)||hidden.has(b.type)) return;
    const dim = focus && !(focus.has(a.id)&&focus.has(b.id));
    ctx.globalAlpha = dim ? 0.06 : 0.5;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
    if (e.type==='memberOf'){ ctx.strokeStyle='#2f3f61'; ctx.lineWidth=0.7; ctx.setLineDash([]); }
    else if (e.type==='filteredBy'){ ctx.strokeStyle='#ffb454'; ctx.lineWidth=1; ctx.setLineDash([1,3]); }
    else if (e.properties && e.properties.mode==='exclude'){ ctx.strokeStyle='#ff7b72'; ctx.lineWidth=1.4; ctx.setLineDash([5,4]); }
    else { ctx.strokeStyle='#9fef00'; ctx.lineWidth=1.4; ctx.setLineDash([]); }
    ctx.stroke();
  });
  ctx.setLineDash([]);

  // nodes
  nodes.forEach(n => {
    if (hidden.has(n.type)) return;
    const dim = focus && !focus.has(n.id);
    const r = (TYPE_RADIUS[n.type]||8);
    ctx.globalAlpha = dim ? 0.12 : 1;
    ctx.beginPath(); ctx.arc(n.x,n.y,r,0,Math.PI*2);
    ctx.fillStyle = TYPE_COLORS[n.type]||'#ccc'; ctx.fill();
    if (n.id===selected){ ctx.lineWidth=2.5; ctx.strokeStyle='#fff'; ctx.stroke(); }
    else if (n.properties && n.properties.missing){ ctx.lineWidth=2; ctx.strokeStyle='#ff7b72'; ctx.stroke(); }
    // label
    if (scale>0.55 && !dim && (r>=9 || n.id===hoverId || n.id===selected)){
      ctx.globalAlpha = dim?0.2:0.9; ctx.fillStyle='#c9d4e3';
      ctx.font = '10px -apple-system,Segoe UI,sans-serif';
      ctx.fillText(n.name||n.id, n.x+r+3, n.y+3);
    }
  });
  ctx.restore();
}
function frame(){ step(); draw(); requestAnimationFrame(frame); }

// ---- interaction ----
let dragging=null, panning=false, lastX=0, lastY=0, down=false, moved=false;
function toWorld(px,py){ return { x:(px-canvas.clientWidth/2-offsetX)/scale, y:(py-canvas.clientHeight/2-offsetY)/scale }; }
function pick(px,py){ const p=toWorld(px,py); let best=null,bd=1e9;
  nodes.forEach(n=>{ if(hidden.has(n.type))return; const dx=n.x-p.x,dy=n.y-p.y,d=dx*dx+dy*dy; const r=(TYPE_RADIUS[n.type]||8)+4; if(d<r*r&&d<bd){bd=d;best=n;} });
  return best; }

canvas.addEventListener('mousedown', e=>{ down=true; moved=false; lastX=e.offsetX; lastY=e.offsetY;
  const hit=pick(e.offsetX,e.offsetY); if(hit){ dragging=hit; } else { panning=true; canvas.classList.add('grabbing'); } });
window.addEventListener('mousemove', e=>{
  const rect=canvas.getBoundingClientRect(); const ox=e.clientX-rect.left, oy=e.clientY-rect.top;
  hoverId = down?hoverId:(pick(ox,oy)||{}).id;
  if(!down) return; moved=true;
  if(dragging){ const p=toWorld(ox,oy); dragging.x=p.x; dragging.y=p.y; dragging.vx=0; dragging.vy=0; kick(); }
  else if(panning){ offsetX+=ox-lastX; offsetY+=oy-lastY; lastX=ox; lastY=oy; }
});
window.addEventListener('mouseup', e=>{
  if(down && !moved){ const rect=canvas.getBoundingClientRect(); const hit=pick(e.clientX-rect.left,e.clientY-rect.top);
    if(hit){ selectNode(hit.id); } else { selected=null; hideSide(); } }
  down=false; dragging=null; panning=false; canvas.classList.remove('grabbing');
});
canvas.addEventListener('wheel', e=>{ e.preventDefault(); const f=e.deltaY<0?1.1:0.9;
  const p=toWorld(e.offsetX,e.offsetY); scale*=f;
  const p2=toWorld(e.offsetX,e.offsetY); offsetX+=(p2.x-p.x)*scale; offsetY+=(p2.y-p.y)*scale; }, {passive:false});

document.getElementById('search').addEventListener('input', e=>{
  const q=e.target.value.trim().toLowerCase(); if(!q){ selected=null; hideSide(); return; }
  const hit=nodes.find(n=>!hidden.has(n.type) && (n.name||'').toLowerCase().includes(q));
  if(hit){ selectNode(hit.id); centerOn(hit); }
});
document.getElementById('reset').addEventListener('click', ()=>{ scale=1; offsetX=0; offsetY=0; selected=null; hideSide(); kick(); });
document.getElementById('sideClose').addEventListener('click', ()=>{ selected=null; hideSide(); });

function centerOn(n){ offsetX=-n.x*scale; offsetY=-n.y*scale; }
function selectNode(id){ selected=id; showSide(nodeById[id]); }
function hideSide(){ document.getElementById('side').classList.remove('show'); }
function showSide(n){
  const el=document.getElementById('side'); el.classList.add('show');
  document.getElementById('sideType').textContent = n.type + (n.subtype?(' · '+n.subtype):'');
  document.getElementById('sideName').textContent = n.name || n.id;
  const props=document.getElementById('sideProps'); props.innerHTML='';
  const p=n.properties||{};
  Object.keys(p).forEach(k=>{ if(p[k]===null||p[k]===''||p[k]===undefined)return;
    const row=document.createElement('div'); row.className='kv'; row.innerHTML=`<b>${k}</b><span>${escapeHtml(String(p[k]))}</span>`; props.appendChild(row); });
  const ed=document.getElementById('sideEdges'); ed.innerHTML='';
  const outs=edges.filter(e=>e.from===n.id), ins=edges.filter(e=>e.to===n.id);
  if(outs.length){ ed.innerHTML+='<div class="stype" style="margin-top:6px">Outgoing</div>';
    outs.forEach(e=>ed.innerHTML+=`<div class="edge">${edgeLabel(e)} <b>${escapeHtml(nodeById[e.to].name||e.to)}</b></div>`); }
  if(ins.length){ ed.innerHTML+='<div class="stype" style="margin-top:6px">Incoming</div>';
    ins.forEach(e=>ed.innerHTML+=`<div class="edge"><b>${escapeHtml(nodeById[e.from].name||e.from)}</b> ${edgeLabel(e)}</div>`); }
}
function edgeLabel(e){ if(e.type==='assignedTo') return (e.properties&&e.properties.mode==='exclude')?'excludes':'assigned to'; if(e.type==='memberOf')return 'member of'; if(e.type==='filteredBy')return 'filtered by'; return e.type; }
function escapeHtml(s){ return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// Start: declared after all interaction state so no temporal-dead-zone access.
// Pre-stabilize the layout and paint once so the graph is settled on first frame,
// then run the animation loop for interactivity.
for (let i=0;i<240;i++) step();
draw();
frame();
</script>
